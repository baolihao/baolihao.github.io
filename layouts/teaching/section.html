<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Teaching | Baoli Hao</title>

  <link rel="stylesheet" href="/css/main.css">
</head>


<body>


<!-- =========================================================
     NAVIGATION
     ========================================================= -->

<header class="site-header">

  <div class="container nav">

    <a class="site-name" href="/">
      Baoli Hao
    </a>

    <nav class="nav-links">

      <a href="/">
        Home
      </a>

      <a href="/research/">
        Research
      </a>

      <a href="/publications/">
        Publications
      </a>

      <a
        class="active"
        href="/teaching/"
      >
        Teaching
      </a>

      <a href="/activities/">
        Activities
      </a>

     <a
  href="/files/CV/Baoli-CV.pdf"
  target="_blank"
  rel="noopener noreferrer"
>
  CV
</a>

    </nav>

  </div>

</header>



<!-- =========================================================
     TEACHING
     ========================================================= -->

<main class="teaching-page">

  <div class="container teaching-container">


    <!-- Page Header -->

    <header class="teaching-header">

      <h1>Teaching</h1>

      <!-- <p>
        Teaching and mentoring experience in applied mathematics
        at Illinois Institute of Technology.
      </p> -->

    </header>



    <!-- =====================================================
         ILLINOIS INSTITUTE OF TECHNOLOGY
         ===================================================== -->

    <section class="teaching-section">

      <h2>
        Illinois Institute of Technology
      </h2>


      <div class="teaching-list">

        {{ range hugo.Data.teaching }}

        <article class="teaching-item">


          <!-- Course information -->

          <div class="teaching-main">

            <h3>

              {{ with .code }}

                <span class="course-code">
                  {{ . }}
                </span>

                <span class="course-divider">
                  ·
                </span>

              {{ end }}

              {{ .course }}

            </h3>


            <p class="teaching-role">
              {{ .role }}
            </p>

          </div>


          <!-- Term -->

          <div class="teaching-term">
            {{ .term }}
          </div>


        </article>

        {{ end }}

      </div>

    </section>


  </div>

</main>



<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer>

  <div class="container">
    © {{ now.Year }} Baoli Hao
  </div>

</footer>


</body>

</html>
